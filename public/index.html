 const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 x.fillStyle='#1b4fa8';x.fillRect(0,0,W,64);
 x.fillStyle='#fff';x.font='bold 22px system-ui,sans-serif';x.fillText('SATSET · List Barangmu',P,30);
 x.font='13px system-ui,sans-serif';x.fillText('Asrama PKN STAN 2026/2027 · '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),P,50);
 let y=P+70;
 sections.forEach(([t,g,col])=>{
  x.fillStyle=col;x.font='bold 18px system-ui,sans-serif';x.fillText(t,P,y);y+=14;
  x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();y+=26;
  if(!g.length){x.fillStyle='#667';x.font='15px system-ui,sans-serif';x.fillText('-',P,y);y+=LH}
  g.forEach(r=>{
   if(r.h){x.fillStyle='#1b4fa8';x.font='bold 15px system-ui,sans-serif';x.fillText(r.h,P,y);y+=LH+6;return}
   x.font='15px system-ui,sans-serif';x.fillStyle=col;x.fillText(col==='#16a34a'?'✔':'☐',P+4,y);
   x.fillStyle='#1c2540';const ls=wrap(r.n,mw(r));
   ls.forEach((l,i)=>x.fillText(l,P+34,y+i*LH));
   if(r.s){x.font='bold 12px system-ui,sans-serif';const tw=x.measureText('SATSET MENYEDIAKAN').width+16,tx=W-P-tw;x.fillStyle='#1b4fa8';x.fillRect(tx,y-14,tw,20);x.fillStyle='#fff';x.fillText('SATSET MENYEDIAKAN',tx+8,y)}
   y+=ls.length*LH+4});
  y+=18});
 c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='list-barang-satset.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/png');
}
function tgk(i,v){const k=ckKey(CEK[i]);if(v)CK[k]=1;else delete CK[k];try{localStorage.setItem('satset_ck',JSON.stringify(CK))}catch(e){}$('#cp').textContent=ckDone()+' dari '+CEK.length+' barang sudah kamu ceklis'}
function start(){
 $('#gb').disabled=true;const s=$('#splash');s.classList.add('go');$('#shell').style.display='block';
 setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),380)},1500);
}
const img=(f,w)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
const loadD=()=>fetch('/api/products').then(r=>r.json()).then(d=>{D=d;draw()}).catch(()=>{if(!D)$('#list').textContent='Gagal memuat. Coba muat ulang halaman.'});
loadD();
function draw(){
 $('#list').innerHTML=D.clusters.map(c=>{const ps=D.products.filter(p=>p.cluster_id==c.id);return ps.length?`<details open><summary>${esc(c.name)}</summary><div class=g>${ps.map(card).join('')}</div></details>`:''}).join('')||'Belum ada produk.';
 D.products.forEach(p=>upd(p.id));bar();
}
function range(vs){const x=vs.filter(v=>v.stock>0&&v.price>0).map(v=>v.price);if(!x.length)return '';const a=Math.min(...x),b=Math.max(...x);return a==b?rp(a):rp(a)+' – '+rp(b)}
function card(p){
 const vs=D.variants.filter(v=>v.product_id==p.id);
 const sel=a=>{const o=[...new Set(vs.map(v=>v[a]).filter(Boolean))];return o.length?`<label>${LB[a]}<select data-a=${a} onchange=upd(${p.id})>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`:''};
 return `<div class=k id=p${p.id}>${gal(p)}<b class=nm>${esc(p.name)}</b><div class=pz>${range(vs)}</div>
<button class=acc onclick=tg(this)><span>📄 Deskripsi${p.size_img?' &amp; panduan ukuran':''}</span><span class=ch>▾</span></button>
<div class=dsc hidden>${p.description?`<div class=dt>${esc(p.description)}</div>`:''}${p.size_img?`<div class=sm style="margin-top:8px">Panduan ukuran:</div><img loading=lazy src="${esc(p.size_img)}" style="width:100%;border-radius:8px">`:''}</div>
<button class=cb onclick=op(${p.id})>🛒 Pilih varian &amp; beli</button>
<div class=opt hidden>${A.map(sel).join('')}<label>Jumlah<input type=number min=1 value=1 data-q onchange=upd(${p.id})></label><div class=pr></div><button data-b onclick=add(${p.id})>Masukkan ke keranjang</button></div></div>`;
}
function tg(b){const d=b.nextElementSibling;d.hidden=!d.hidden;b.classList.toggle('on',!d.hidden)}
function op(pid){const o=$('#p'+pid).querySelector('.opt');o.hidden=!o.hidden}
function gal(p){const im=p.images||[];if(!im.length)return '';
 return `<div class=gw><div class=ss onscroll=gs(this)>${im.map(u=>`<img loading=lazy decoding=async src="${esc(u)}">`).join('')}</div>${im.length>1?`<span class=gc>1/${im.length}</span><button class="ga l" onclick="gm(this,-1)">‹</button><button class="ga r" onclick="gm(this,1)">›</button>`:''}</div>`}
function gm(b,d){const s=b.parentNode.querySelector('.ss');s.scrollBy({left:d*s.clientWidth,behavior:'smooth'})}
function gs(s){const c=s.parentNode.querySelector('.gc');if(c)c.textContent=(Math.round(s.scrollLeft/s.clientWidth)+1)+'/'+s.children.length}
function guide(pid){const p=D.products.find(x=>x.id==pid);$('#dlg').innerHTML=`<h3>Panduan ukuran</h3><img src="${esc(p.size_img)}" style="max-width:100%"><button class=gr onclick="$('#dlg').close()">Tutup</button>`;$('#dlg').showModal()}
function sel(pid){const s={};$('#p'+pid).querySelectorAll('select').forEach(x=>s[x.dataset.a]=x.value);return D.variants.find(v=>v.product_id==pid&&A.every(a=>!s[a]||v[a]==s[a]))}
function qty(pid){return Math.max(1,Math.floor(+$('#p'+pid).querySelector('[data-q]').value)||1)}
function upd(pid){
 const el=$('#p'+pid),v=sel(pid),q=qty(pid),pr=el.querySelector('.pr'),b=el.querySelector('[data-b]');
 if(!v||v.stock<1||!(v.price>0)){pr.textContent=!v?'Kombinasi tidak tersedia':v.stock<1?'Habis terjual':'Harga belum tersedia';b.disabled=true}
 else{pr.innerHTML=`<b>${rp(v.price)}</b><br>Subtotal ${rp(v.price*q)}${v.stock<=5?`<br><small style="color:#d33">Sisa ${v.stock}</small>`:''}`;b.disabled=false}
}
function add(pid){
 const v=sel(pid),p=D.products.find(x=>x.id==pid);if(!v)return;
 cart[v.id]={v,q:Math.min(qty(pid),v.stock),name:[p.name,v.model,v.size,v.color].filter(Boolean).join(' ')};bar();
 const e=$('#p'+pid),b=e.querySelector('.cb');e.querySelector('.opt').hidden=true;b.textContent='✅ Masuk keranjang';setTimeout(()=>b.innerHTML='🛒 Pilih varian &amp; beli',1400);
}
function bar(){
 const n=Object.values(cart),t=n.reduce((s,i)=>s+i.v.price*i.q,0);
 $('#bar').innerHTML=n.length?`<div class=bar>${n.length} item: <b>${rp(t)}</b><button onclick=co()>Checkout</button></div>`:'';
}
function rm(id){delete cart[id];bar();Object.keys(cart).length?co():$('#dlg').close()}
function co(){
 const n=Object.values(cart),t=n.reduce((s,i)=>s+i.v.price*i.q,0);
 $('#dlg').innerHTML=`<h3>Pesanan</h3>${n.map(i=>`<div>${esc(i.name)} x${i.q} = ${rp(i.v.price*i.q)} <button style="width:auto;background:#d33" onclick=rm(${i.v.id})>x</button></div>`).join('')}<p><b>Total ${rp(t)}</b></p><input id=nm placeholder="Nama"><input id=hp placeholder="No. HP/WA" inputmode=tel><input id=pr placeholder="Prodi"><input id=gg placeholder="Gugus"><p>Scan QRIS dan bayar sesuai total:</p>${D.qris?`<img src="${esc(D.qris)}" style="max-width:100%">`:'<p><i>QRIS belum diatur penjual.</i></p>'}<input id=rt placeholder="Ketik ulang total (angka saja)" inputmode=numeric><p>Upload bukti bayar:</p><input id=pf type=file accept=image/*><button id=sd onclick=send()>Kirim pesanan</button><button class=gr onclick="$('#dlg').close()">Tutup</button>`;
 $('#dlg').showModal();
}
async function send(){
 if(sending)return;
 const nm=$('#nm').value.trim(),hp=$('#hp').value.trim(),f=$('#pf').files[0],b=$('#sd');
 const pr=$('#pr').value.trim(),gg=$('#gg').value.trim(),rt=+($('#rt').value.replace(/\D/g,'')),tot=Object.values(cart).reduce((s,i)=>s+i.v.price*i.q,0);
 if(!nm||!hp||!pr||!gg||!f)return alert('Isi nama, nomor HP, prodi, gugus, dan upload bukti bayar.');
 if(rt!==tot)return alert('Total yang kamu ketik ulang belum sama dengan total pesanan ('+rp(tot)+').');
 sending=true;b.disabled=true;b.textContent='Mengirim...';
 try{
  const proof=await img(f,800);
  const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,phone:hp,prodi:pr,gugus:gg,proof,items:Object.values(cart).map(i=>({variant_id:i.v.id,qty:i.q}))})});
  const j=await r.json();
  if(!r.ok){alert(j.error);if(r.status===409){cart={};bar();$('#dlg').close();loadD()}return}
  cart={};bar();loadD();const wa=D&&D.wa;
  $('#dlg').innerHTML=`<h3>Pesanan diterima ✅</h3><p>Nomor pesanan <b>#${j.id}</b>. Pembayaranmu sedang kami cek.</p>${wa?`<p>Kamu akan diarahkan ke grup WhatsApp dalam <b id=cd>3</b> detik…</p><a href="${esc(wa)}"><button>Gabung grup sekarang</button></a>`:''}<button class=gr onclick="$('#dlg').close()">Tutup</button>`;
  if(wa){let n=3;const t=setInterval(()=>{n--;const c=$('#cd');if(c)c.textContent=n;if(n<=0){clearInterval(t);location.href=wa}},1000)}
 }catch(e){alert('Koneksi bermasalah, coba lagi.')}
 finally{sending=false;if(b){b.disabled=false;b.textContent='Kirim pesanan'}}
}

/* ===== CEK PESANANMU + DOWNLOAD NOTA ===== */
(()=>{
 const st=document.createElement('style');
 st.textContent=`#cpd{max-width:560px;width:96%;max-height:90vh;padding:14px}#cpd[open]{display:flex;flex-direction:column;gap:6px}.cph{display:flex;justify-content:space-between;align-items:center;color:#1b4fa8;font-size:17px}.cpb{overflow:auto;flex:1}.po{border:1px solid #dbe5ff;border-radius:10px;padding:10px;margin:8px 0;background:#fafcff}.po table{width:100%;border-collapse:collapse;font-size:14px}.po td{padding:3px 0;vertical-align:top}.po td.n{text-align:right;white-space:nowrap;padding-left:8px}.po .tt td{border-top:1px solid #dbe5ff;font-weight:700;padding-top:6px}.po .hh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.po button{margin-top:8px;background:#16a34a;font-weight:700}.stp{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.stp.menunggu{background:#fef3c7;color:#92400e}.stp.lunas{background:#dcfce7;color:#166534}.stp.batal{background:#fee2e2;color:#b91c1c}`;
 document.head.appendChild(st);

 const d=document.createElement('dialog');d.id='cpd';
 d.innerHTML=`<div class=cph><b>📦 Cek pesananmu</b><button class=gr style="width:auto" onclick="document.querySelector('#cpd').close()">Tutup</button></div><input id=cpq placeholder="Ketik namamu (min. 3 huruf)..." autocomplete=off><div class=cpb id=cpr></div>`;
 document.body.appendChild(d);

 const b=document.createElement('button');
 b.className='ckbtn';b.style.background='var(--b2)';b.textContent='📦 Cek pesananmu';
 b.onclick=()=>{$('#cpq').value='';$('#cpr').innerHTML='<p class=sm>Ketik namamu seperti saat memesan, pesananmu langsung muncul.</p>';d.showModal();setTimeout(()=>$('#cpq').focus(),50)};
 document.querySelector('.cbt').prepend(b);

 const SL={menunggu:'Menunggu konfirmasi',lunas:'Lunas',batal:'Dibatalkan'};
 let OL=[];
 const show=L=>L.length?L.map((o,i)=>`<div class=po><div class=hh><b>#${o.id} · ${esc(o.name)}</b><span class="stp ${esc(o.status)}">${esc(SL[o.status]||o.status)}</span></div><div class=sm style="margin-bottom:4px">${new Date(o.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</div><table>${o.items.map(it=>`<tr><td>${esc(it.name)} <span class=sm>x${it.qty}</span><td class=n>${it.price?rp(it.price*it.qty):'-'}</tr>`).join('')}<tr class=tt><td>Total<td class=n>${rp(o.total)}</tr></table><button onclick="dlNota(${i})">⬇️ Download nota</button></div>`).join(''):'<p>Tidak ada pesanan atas nama itu. Cek ejaan namamu, atau chat admin.</p>';

 let t,seq=0;
 $('#cpq').oninput=()=>{
  clearTimeout(t);const v=$('#cpq').value.trim(),box=$('#cpr');
  if(v.length<3){box.innerHTML='<p class=sm>Ketik minimal 3 huruf nama kamu.</p>';return}
  box.innerHTML='<p class=sm>Mencari...</p>';
  t=setTimeout(async()=>{
   const my=++seq;
   try{
    let r=await fetch('/api/myorders?q='+encodeURIComponent(v));
    if(r.status===404)r=await fetch('/api/admin?w=my&q='+encodeURIComponent(v));
    const j=await r.json();
    if(my!==seq)return;
    OL=r.ok?j.orders:[];
    box.innerHTML=r.ok?show(OL):'<p>'+esc(j.error||'Gagal memuat')+'</p>';
   }catch(e){if(my===seq)box.innerHTML='<p>Koneksi bermasalah, coba lagi.</p>'}
  },350);
 };

 window.dlNota=async i=>{
  const o=OL[i];if(!o)return;
  const W=800,S=2,P=32,LH=22,NW=W-2*P-300,F='system-ui,sans-serif';
  const m=document.createElement('canvas').getContext('2d');m.font='15px '+F;
  const wrap=(tx,w)=>{const out=[];let l='';String(tx).split(' ').forEach(wd=>{const a=l?l+' '+wd:wd;if(m.measureText(a).width>w&&l){out.push(l);l=wd}else l=a});if(l)out.push(l);return out.length?out:['']};
  const rows=o.items.map(it=>({it,ls:wrap(it.name,NW)}));
  const rh=r=>r.ls.length*LH+12;
  const H=224+rows.reduce((s,r)=>s+rh(r),0)+40+220;
  const lg=await new Promise(r=>{const g=new Image();g.onload=()=>r(g);g.onerror=()=>r(null);g.src=LOGO});
  const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#1b4fa8';x.fillRect(0,0,W,64);
  x.fillStyle='#fff';x.textAlign='left';x.font='bold 22px '+F;x.fillText('SATSET · Bukti Pesanan',P,30);
  x.font='13px '+F;x.fillText('Order dan Ambil',P,50);
  const col={menunggu:'#92400e',lunas:'#166534',batal:'#b91c1c'}[o.status]||'#1c2540';
  x.fillStyle='#1c2540';x.font='bold 18px '+F;x.fillText('No. pesanan #'+o.id,P,96);
  x.font='15px '+F;
  x.fillText('Nama: '+o.name,P,124);
  x.fillText('Tanggal: '+new Date(o.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),P,148);
  x.fillStyle=col;x.font='bold 15px '+F;x.fillText('Status: '+(SL[o.status]||o.status),P,172);
  const xq=W-P-250,xp=W-P-130,xs=W-P-8;
  x.fillStyle='#e8efff';x.fillRect(P,196,W-2*P,28);
  x.fillStyle='#1b4fa8';x.font='bold 13px '+F;x.textAlign='left';x.fillText('Barang',P+8,215);
  x.textAlign='right';x.fillText('Jml',xq,215);x.fillText('Harga',xp,215);x.fillText('Subtotal',xs,215);
  let y=224;
  rows.forEach(r=>{
   x.fillStyle='#1c2540';x.font='15px '+F;x.textAlign='left';
   r.ls.forEach((l,k)=>x.fillText(l,P+8,y+LH-4+k*LH));
   x.textAlign='right';
   x.fillText(String(r.it.qty),xq,y+LH-4);
   x.fillText(r.it.price?rp(r.it.price):'-',xp,y+LH-4);
   x.fillText(r.it.price?rp(r.it.price*r.it.qty):'-',xs,y+LH-4);
   y+=rh(r);
   x.strokeStyle='#e3e9fb';x.lineWidth=1;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();
  });
  x.fillStyle='#e8efff';x.fillRect(P,y,W-2*P,40);
  x.fillStyle='#1b4fa8';x.font='bold 17px '+F;x.textAlign='left';x.fillText('Total',P+8,y+26);
  x.textAlign='right';x.fillText(rp(o.total),xs,y+26);
  y+=40;
  const cx=W-P-100,cy=y+16+75;
  if(lg){
   x.save();x.translate(cx,cy);x.rotate(-0.14);x.globalAlpha=.92;
   x.beginPath();x.arc(0,0,72,0,Math.PI*2);x.lineWidth=4;x.strokeStyle='#1b4fa8';x.stroke();
   x.beginPath();x.arc(0,0,66,0,Math.PI*2);x.clip();
   x.drawImage(lg,-66,-66,132,132);
   x.restore();
  }
  x.textAlign='center';x.fillStyle='#1c2540';x.font='bold 16px '+F;
  x.fillText('Admin Satset Ganteng',cx,cy+72+26);
  x.textAlign='left';x.fillStyle='#667';x.font='12px '+F;
  x.fillText('Dicetak '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),P,H-20);
  c.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='pesanan-satset-'+o.id+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/png');
 };
})();
</script>
