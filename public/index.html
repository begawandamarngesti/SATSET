<!doctype html><html lang=id><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#1b4fa8"><title>SATSET</title>
<style>
:root{--b:#1b4fa8;--b2:#4f6ef7;--bl:#e8efff;--bg:#f2f6ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{font:15px system-ui,sans-serif;margin:0;background:var(--bg);color:#1c2540;padding-bottom:76px}
#splash{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;transition:opacity .35s}
#splash img{width:min(62vw,260px);height:auto}
#splash p{max-width:360px;color:#3b4a6b;margin:18px 0 26px;line-height:1.55}
.go-btn{background:var(--b);color:#fff;border:0;border-radius:999px;padding:14px 38px;font-size:17px;font-weight:700;cursor:pointer;width:auto;box-shadow:0 6px 18px #1b4fa855}
#splash.go #lg{animation:zoom 1.5s ease-in forwards}
#splash.go p,#splash.go .go-btn{opacity:0;transition:opacity .4s}
@keyframes zoom{to{transform:rotate(360deg) scale(7);filter:blur(16px);opacity:.15}}
#shell{display:none}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1b4fa8,#3b6ae0);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #1b4fa855}
.hd b{font-size:20px;letter-spacing:1px}.hd small{display:block;opacity:.85}
.hd img{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid #fff}
#app{max-width:1000px;margin:auto;padding:10px}
.chat{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bl);border:1px solid #c7d6ff;border-left:5px solid var(--b);border-radius:10px;padding:10px 12px;margin:10px 0}
.chat a,.tb button,button{font:inherit;padding:8px 12px;border:0;border-radius:8px;background:var(--b);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.chat a{background:#16a34a;white-space:nowrap;font-weight:600}
.tb{display:flex;gap:8px;margin:8px 0}.tb button{flex:1}.tb .out{background:var(--b2)}
#sum{background:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;border:1px solid #c7d6ff}
.sr{position:relative;display:flex;justify-content:space-between;padding:6px 0 8px;border-bottom:1px solid #eef}
.sr i{position:absolute;left:0;bottom:2px;height:4px;border-radius:2px;background:var(--b2)}
.sm{font-size:12px;color:#667}
summary{font-weight:700;font-size:18px;padding:10px 0;cursor:pointer;color:var(--b)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.k{background:#fff;border-radius:12px;padding:10px;border:1px solid #dbe5ff;box-shadow:0 2px 8px #1b4fa81a}
.k img{width:100%;border-radius:8px}
.gw{position:relative}.ss{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:8px;scrollbar-width:none}.ss::-webkit-scrollbar{display:none}.ss img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center;border-radius:0}.gc{position:absolute;right:6px;bottom:6px;background:#0008;color:#fff;font-size:11px;padding:2px 7px;border-radius:10px}.ga{position:absolute;top:50%;transform:translateY(-50%);width:28px!important;height:28px;padding:0;border-radius:50%;background:#0006;font-size:18px;margin:0!important}.ga.l{left:4px}.ga.r{right:4px}
.hot{font-size:12px;color:#c2410c;font-weight:600;min-height:0}
label{display:block;font-size:12px;color:#556}
select,input{font:inherit;padding:7px;border:1px solid #bcc9ee;border-radius:6px;width:100%;margin:2px 0}
.k button,dialog button{width:100%;margin:2px 0}
button:disabled{background:#bbb}button.gr{background:#7b8499}button.ln{background:var(--bl);color:var(--b)}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 -2px 8px #1b4fa83a;z-index:6}.bar button{width:auto}
dialog{max-width:420px;width:92%;border-radius:12px;border:0}dialog h3{color:var(--b)}
</style>
<div id=splash><img id=lg data-logo alt="SATSET"><p>Penyedia kebutuhan dinamika dan asrama terpercaya selama 2 tahun lebih dan 1000+ mahasiswa baru</p><button class=go-btn id=gb onclick=start()>Mulai Belanja</button></div>

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),rp=n=>'Rp'+(+n).toLocaleString('id-ID');
const A=['model','size','color'],LB={model:'Model',size:'Ukuran',color:'Warna'};
const WA='https://wa.me/6282333872895?text='+encodeURIComponent('Halo bang, mau nanya');
let D,cart={},sending=false;
document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);
{const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)}
$('#wa').href=WA;
function start(){
 $('#gb').disabled=true;const s=$('#splash');s.classList.add('go');$('#shell').style.display='block';
 setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),380)},1500);
}
const img=(f,w)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
const loadD=()=>fetch('/api/products').then(r=>r.json()).then(d=>{D=d;draw()}).catch(()=>{if(!D)$('#list').textContent='Gagal memuat. Coba muat ulang halaman.'});
loadD();
function draw(){
 $('#list').innerHTML=D.clusters.map(c=>{const ps=D.products.filter(p=>p.cluster_id==c.id);return ps.length?`<details open><summary>${esc(c.name)}</summary><div class=g>${ps.map(card).join('')}</div></details>`:''}).join('')||'Belum ada produk.';
 D.products.forEach(p=>upd(p.id));bar();
}
function range(vs){const x=vs.filter(v=>v.stock>0&&v.price>0).map(v=>v.price);if(!x.length)return '';const a=Math.min(...x),b=Math.max(...x);return a==b?rp(a):rp(a)+' – '+rp(b)}
function card(p){
 const vs=D.variants.filter(v=>v.product_id==p.id);
 return `<div class=k id=p${p.id}>${gal(p)}<b>${esc(p.name)}</b><div style="color:#1b4fa8;font-size:13px">${range(vs)}</div><p>${esc(p.description)}</p>${p.size_img?`<button class=ln onclick="guide(${p.id})">📏 Panduan ukuran</button>`:''}${A.map(a=>{const o=[...new Set(vs.map(v=>v[a]).filter(Boolean))];return o.length?`<label>${LB[a]}<select data-a=${a} onchange=upd(${p.id})>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`:''}).join('')}<label>Jumlah<input type=number min=1 value=1 data-q onchange=upd(${p.id})></label><div class=pr></div><button data-b onclick=add(${p.id})>Tambah ke keranjang</button></div>`;
}
function gal(p){const im=p.images||[];if(!im.length)return '';
 return `<div class=gw><div class=ss onscroll=gs(this)>${im.map(u=>`<img loading=lazy decoding=async src="${esc(u)}">`).join('')}</div>${im.length>1?`<span class=gc>1/${im.length}</span><button class="ga l" onclick="gm(this,-1)">‹</button><button class="ga r" onclick="gm(this,1)">›</button>`:''}</div>`}
function gm(b,d){const s=b.parentNode.querySelector('.ss');s.scrollBy({left:d*s.clientWidth,behavior:'smooth'})}
function gs(s){const c=s.parentNode.querySelector('.gc');if(c)c.textContent=(Math.round(s.scrollLeft/s.clientWidth)+1)+'/'+s.children.length}
function guide(pid){const p=D.products.find(x=>x.id==pid);$('#dlg').innerHTML=`<h3>Panduan ukuran</h3><img src="${esc(p.size_img)}" style="max-width:100%"><button class=gr onclick="$('#dlg').close()">Tutup</button>`;$('#dlg').showModal()}
function sel(pid){const s={};$('#p'+pid).querySelectorAll('select').forEach(x=>s[x.dataset.a]=x.value);return D.variants.find(v=>v.product_id==pid&&A.every(a=>!s[a]||v[a]==s[a]))}
function qty(pid){return Math.max(1,Math.floor(+$('#p'+pid).querySelector('[data-q]').value)||1)}
function upd(pid){
 const el=$('#p'+pid),v=sel(pid),q=qty(pid),pr=el.querySelector('.pr'),b=el.querySelector('[data-b]');
 if(!v||v.stock<1||!(v.price>0)){pr.textContent=!v?'Kombinasi tidak tersedia':v.stock<1?'Habis terjual':'Harga belum tersedia';b.disabled=true}
 else{pr.innerHTML=`<b>${rp(v.price)}</b><br>Subtotal ${rp(v.price*q)}${v.stock<=5?`<br><small style="color:#d33">Sisa ${v.stock}</small>`:''}`;b.disabled=false}
}
function add(pid){
 const v=sel(pid),p=D.products.find(x=>x.id==pid);if(!v)return;
 cart[v.id]={v,q:Math.min(qty(pid),v.stock),name:[p.name,v.model,v.size,v.color].filter(Boolean).join(' ')};bar();
}
function bar(){
 const n=Object.values(cart),t=n.reduce((s,i)=>s+i.v.price*i.q,0);
 $('#bar').innerHTML=n.length?`<div class=bar>${n.length} item: <b>${rp(t)}</b><button onclick=co()>Checkout</button></div>`:'';
}
function rm(id){delete cart[id];bar();Object.keys(cart).length?co():$('#dlg').close()}
function co(){
 const n=Object.values(cart),t=n.reduce((s,i)=>s+i.v.price*i.q,0);
 $('#dlg').innerHTML=`<h3>Pesanan</h3>${n.map(i=>`<div>${esc(i.name)} x${i.q} = ${rp(i.v.price*i.q)} <button style="width:auto;background:#d33" onclick=rm(${i.v.id})>x</button></div>`).join('')}<p><b>Total ${rp(t)}</b></p><input id=nm placeholder="Nama"><input id=hp placeholder="No. HP/WA" inputmode=tel><input id=pr placeholder="Prodi"><input id=gg placeholder="Gugus"><p>Scan QRIS dan bayar sesuai total:</p>${D.qris?`<img src="${esc(D.qris)}" style="max-width:100%">`:'<p><i>QRIS belum diatur penjual.</i></p>'}<input id=rt placeholder="Ketik ulang total (angka saja)" inputmode=numeric><p>Upload bukti bayar:</p><input id=pf type=file accept=image/*><button id=sd onclick=send()>Kirim pesanan</button><button class=gr onclick="$('#dlg').close()">Tutup</button>`;
 $('#dlg').showModal();
}
async function send(){
 if(sending)return;
 const nm=$('#nm').value.trim(),hp=$('#hp').value.trim(),f=$('#pf').files[0],b=$('#sd');
 const pr=$('#pr').value.trim(),gg=$('#gg').value.trim(),rt=+($('#rt').value.replace(/\D/g,'')),tot=Object.values(cart).reduce((s,i)=>s+i.v.price*i.q,0);
 if(!nm||!hp||!pr||!gg||!f)return alert('Isi nama, nomor HP, prodi, gugus, dan upload bukti bayar.');
 if(rt!==tot)return alert('Total yang kamu ketik ulang belum sama dengan total pesanan ('+rp(tot)+').');
 sending=true;b.disabled=true;b.textContent='Mengirim...';
 try{
  const proof=await img(f,800);
  const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,phone:hp,prodi:pr,gugus:gg,proof,items:Object.values(cart).map(i=>({variant_id:i.v.id,qty:i.q}))})});
  const j=await r.json();
  if(!r.ok){alert(j.error);if(r.status===409){cart={};bar();$('#dlg').close();loadD()}return}
  cart={};bar();loadD();const wa=D&&D.wa;
  $('#dlg').innerHTML=`<h3>Pesanan diterima ✅</h3><p>Nomor pesanan <b>#${j.id}</b>. Pembayaranmu sedang kami cek.</p>${wa?`<p>Kamu akan diarahkan ke grup WhatsApp dalam <b id=cd>3</b> detik…</p><a href="${esc(wa)}"><button>Gabung grup sekarang</button></a>`:''}<button class=gr onclick="$('#dlg').close()">Tutup</button>`;
  if(wa){let n=3;const t=setInterval(()=>{n--;const c=$('#cd');if(c)c.textContent=n;if(n<=0){clearInterval(t);location.href=wa}},1000)}
 }catch(e){alert('Koneksi bermasalah, coba lagi.')}
 finally{sending=false;if(b){b.disabled=false;b.textContent='Kirim pesanan'}}
}
</script>
